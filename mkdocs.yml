site_name: Eclipse Connected Services Platform (ECSP)
theme:
  name: material
  logo: images/CSP logo.svg
  favicon: images/CSP logo.svg
  font: 
    text: Roboto
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
extra_css: 
  - stylesheets/extra.css
nav:
  - Get started:
      - Introduction: README.md
      - Eclipse CSP Use Cases: deployment/UseCaseDiagrams.md
      - Architecture: deployment/Architecture.md
      - How to Deploy: deployment/README.md
  - Development:
      - Offboard Server Build: build/build_guidelines.md
      - Onboard Device Client Build: build/device-client-build_guidelines.md
      - Mobile Application Build: build/mobile-app-build_guidelines.md
      - Libraries Build: build/libraries.md
      - Components Build: build/components.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      # line_spans: __span
      # pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


